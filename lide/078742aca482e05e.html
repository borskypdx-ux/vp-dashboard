<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Váš Praktik — zabezpečený dashboard</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0a0b0d; color: #e8eaed;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  .karta {
    width: min(92vw, 420px); padding: 32px 28px; border-radius: 16px;
    background: #14161a; border: 1px solid #23262d;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .znacka { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: #2DD4BF; font-weight: 700; }
  h1 { font-size: 20px; margin: 8px 0 4px; }
  p.sub { margin: 0 0 22px; color: #9aa0aa; font-size: 14px; line-height: 1.5; }
  label { display: block; font-size: 13px; color: #9aa0aa; margin-bottom: 6px; }
  .radek { display: flex; gap: 8px; }
  input[type=password] {
    flex: 1; padding: 12px 14px; border-radius: 10px; font-size: 16px;
    background: #0a0b0d; border: 1px solid #2b2f37; color: #e8eaed; outline: none;
  }
  input[type=password]:focus { border-color: #2DD4BF; }
  button {
    padding: 12px 18px; border-radius: 10px; border: 0; cursor: pointer;
    background: #2DD4BF; color: #06231f; font-weight: 700; font-size: 15px;
  }
  button:disabled { opacity: .5; cursor: progress; }
  .chyba { margin-top: 14px; color: #ff6b6b; font-size: 13px; min-height: 18px; }
  .pata { margin-top: 22px; font-size: 12px; color: #5a606b; line-height: 1.5; }
  .zamek { font-size: 28px; }
</style>
</head>
<body>
  <form class="karta" id="form" autocomplete="off">
    <div class="zamek">🔒</div>
    <div class="znacka">Váš Praktik</div>
    <h1>Můj přehled — Váš Praktik</h1>
    <p class="sub">Obsah této stránky je šifrovaný. Zadej heslo, které jsi dostal/a. Heslo se nikam neposílá — odemyká stránku jen u tebe v prohlížeči.</p>
    <label for="heslo">Heslo</label>
    <div class="radek">
      <input type="password" id="heslo" name="heslo" autofocus autocomplete="current-password" placeholder="••••••••">
      <button type="submit" id="btn">Odemknout</button>
    </div>
    <div class="chyba" id="chyba"></div>
    <div class="pata">Pokud heslo nemáš, vyžádej si ho u správce. Po zavření stránky se zámek zase aktivuje.</div>
  </form>

function b64ToBytes(s) {
  const bin = atob(s);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function odemkni(heslo) {
  const salt = b64ToBytes(PAYLOAD.salt);
  const iv = b64ToBytes(PAYLOAD.iv);
  const ct = b64ToBytes(PAYLOAD.ct);
  const baseKey = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(heslo), { name: 'PBKDF2' }, false, ['deriveKey']
  );
  const klic = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: PAYLOAD.iter, hash: PAYLOAD.hash },
    baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
  );
  const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv, tagLength: 128 }, klic, ct);
  return new TextDecoder().decode(plainBuf);
}

const form = document.getElementById('form');
const inp = document.getElementById('heslo');
const btn = document.getElementById('btn');
const chyba = document.getElementById('chyba');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!PAYLOAD) { chyba.textContent = 'Stránka ještě neobsahuje data (build neproběhl).'; return; }
  chyba.textContent = '';
  btn.disabled = true; btn.textContent = 'Odemykám…';
  try {
    const html = await odemkni(inp.value);
    // Úspěch: nahraď celou stránku rozšifrovaným dashboardem.
    document.open();
    document.write(html);
    document.close();
  } catch (err) {
    // AES-GCM ověří integritu – špatné heslo selže právě tady.
    chyba.textContent = 'Špatné heslo. Zkus to znovu.';
    btn.disabled = false; btn.textContent = 'Odemknout';
    inp.select();
  }
});
